<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
<title id="title">Implemented Golem tile</title><desc id="desc">QEMU functional execution connects through control, NIC and analog bridges to SST timing. Banked scratchpad serves CPU and DMA; global RAM uses separate DMA links.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><style>text{font-family:DejaVu Sans,sans-serif;fill:#172b45} .title{font-size:26px;font-weight:bold}.head{font-size:19px;font-weight:bold}.body{font-size:16px}.small{font-size:14px}.box{fill:#eff6ff;stroke:#517394;stroke-width:1.5}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style></defs>
<rect width="1100" height="820" fill="white"/>
<text x="35" y="42" class="title">Golem tile: functional state and timed resources</text>
<rect x="30" y="65" width="1040" height="155" rx="12" fill="#f0fdf4" stroke="#438267"/>
<text x="50" y="96" class="head">QEMU · one bare-metal RV64 hart</text>
<text x="50" y="128" class="body">Scalar + RVV 1.0 execution · default VLEN 256, ELEN 64 · XGolemAnalog 1.0</text>
<text x="50" y="157" class="body">Guest control RAM · private SPM when enabled · MMIO / analog commands</text>
<text x="50" y="190" class="small">Functional bytes and registers live here; fd 44 maps shared global-RAM backing when configured.</text>
<path d="M180 280V295" class="line"/><path d="M550 280V295" class="line"/><path d="M920 280V295" class="line"/>
<text x="65" y="248" class="body">fd 41 · control v26</text><text x="65" y="272" class="small">grants, stops, waits, records</text>
<text x="440" y="248" class="body">fd 42 · NIC data v7</text><text x="440" y="272" class="small">packet / DMA payloads</text>
<text x="812" y="248" class="body">fd 43 · analog v1</text><text x="812" y="272" class="small">commands / operands / results</text>
<rect x="30" y="300" width="1040" height="410" rx="12" fill="#f8fafc" stroke="#517394"/>
<text x="50" y="333" class="head">SST · simulated time authority</text>
<rect x="50" y="355" width="295" height="105" rx="8" class="box"/>
<text x="65" y="385" class="head">CPU execution controller</text><text x="65" y="415" class="body">Issue accounting + device waits</text><text x="65" y="443" class="small">No detailed RVV arithmetic pipeline</text>
<rect x="395" y="355" width="310" height="105" rx="8" class="box"/>
<text x="413" y="385" class="head">NIC / TX and RX DMA</text><text x="413" y="415" class="body">1, 2, or 4 TX / RX lanes</text><text x="413" y="443" class="small">Bounded queues and TX FIFO</text>
<rect x="755" y="355" width="295" height="105" rx="8" class="box"/>
<text x="773" y="385" class="head">Analog controller / arrays</text><text x="773" y="415" class="body">Shared half-duplex 256-bit link</text><text x="773" y="443" class="small">Array count configurable; optional</text>
<path d="M197 460V510" class="line both"/><path d="M550 460V510" class="line both"/>
<rect x="50" y="515" width="655" height="95" rx="8" fill="#fff7ed" stroke="#b77c36"/>
<text x="68" y="546" class="head">Private noncoherent SPM timing · optional</text>
<text x="68" y="574" class="body">Capacity, banks, read/write ports, width, latency</text>
<text x="68" y="597" class="small">CPU + network DMA + global DMA share bank/port reservations</text>
<rect x="755" y="515" width="295" height="95" rx="8" class="box"/>
<text x="773" y="546" class="head">Optional StandardMem</text><text x="773" y="574" class="body">Ordinary RAM data timing</text><text x="773" y="597" class="small">memory_backend=memhierarchy</text>
<path d="M345 480H900V510" class="line"/><path d="M197 460V480H345" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M350 623V641" class="line both"/>
<text x="68" y="679" class="body">Global DMA client · tokens + local and global completion deadlines</text>
<path d="M550 460H730V754H795" class="line both"/>
<text x="745" y="640" class="small">NIC port</text>
<path d="M350 704V739" class="line both"/>
<rect x="50" y="744" width="610" height="50" rx="8" fill="#f0fdf4" stroke="#438267"/>
<text x="68" y="775" class="body">Shared global RAM controller · dedicated SST DMA links</text>
<rect x="805" y="730" width="245" height="64" rx="8" class="box"/>
<text x="828" y="769" class="head">Mesh router</text>
</svg>

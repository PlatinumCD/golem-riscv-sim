<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
  <title id="title">Single tile architecture</title>
  <desc id="desc">A RISC-V processor with scalar and vector execution connects to a banked scratchpad and optional analog arrays. Send and receive engines connect the scratchpad to a network interface and mesh router.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#526477"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #233446; font-size: 17px; text-anchor: middle; }
      .label { font-size: 14px; fill: #526477; }
      .wire { fill: none; stroke: #526477; stroke-width: 2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .box { fill: #fff; stroke: #a3b1bf; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="800" height="650" fill="#fff"/>
  <rect x="36" y="20" width="728" height="583" rx="16" fill="#f8fafc" stroke="#c5ced8" stroke-width="1.5"/>
  <text x="67" y="49" style="text-anchor:start;font-size:14px;font-weight:bold;letter-spacing:2px">TILE</text>

  <rect class="box" x="185" y="68" width="340" height="102" rx="9"/>
  <text x="355" y="96">RISC-V processor</text>
  <rect x="203" y="113" width="141" height="39" rx="5" fill="#e9eff7"/>
  <rect x="356" y="113" width="151" height="39" rx="5" fill="#e9eff7"/>
  <text x="273" y="138" class="label">Scalar</text>
  <text x="431" y="138" class="label">Vector · RVV</text>

  <path class="wire both" d="M 525 119 H 568" stroke-dasharray="5 4"/>
  <rect x="570" y="77" width="164" height="84" rx="9" fill="#faf7f1" stroke="#b6a888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="652" y="110">Analog arrays</text>
  <text x="652" y="137" class="label">Optional</text>

  <path class="wire both" d="M 355 172 V 208"/>
  <rect x="160" y="211" width="390" height="103" rx="9" fill="#eef6f3" stroke="#8aafa0" stroke-width="1.5"/>
  <text x="355" y="243">Scratchpad</text>
  <rect x="181" y="261" width="106" height="34" rx="4" fill="#fff" stroke="#b1c9bd"/>
  <rect x="297" y="261" width="106" height="34" rx="4" fill="#fff" stroke="#b1c9bd"/>
  <rect x="448" y="261" width="81" height="34" rx="4" fill="#fff" stroke="#b1c9bd"/>
  <text x="234" y="284" class="label">Bank 0</text>
  <text x="350" y="284" class="label">Bank 1</text>
  <text x="425" y="284">…</text>
  <text x="488" y="284" class="label">Bank n</text>

  <path class="wire" d="M 245 314 V 351"/>
  <path class="wire" d="M 465 351 V 316"/>
  <rect class="box" x="160" y="354" width="170" height="54" rx="8"/>
  <rect class="box" x="380" y="354" width="170" height="54" rx="8"/>
  <text x="245" y="386">Send engines</text>
  <text x="465" y="386">Receive engines</text>

  <path class="wire" d="M 245 408 V 439"/>
  <path class="wire" d="M 465 439 V 410"/>
  <rect class="box" x="160" y="442" width="390" height="47" rx="8"/>
  <text x="355" y="472">Network interface</text>

  <path class="wire both" d="M 355 491 V 521"/>
  <rect x="265" y="524" width="180" height="50" rx="8" fill="#e9eff7" stroke="#96abc4" stroke-width="1.5"/>
  <text x="355" y="555">Mesh router</text>
  <path class="wire both" d="M 263 549 H 91"/>
  <text x="106" y="534" class="label">West</text>
  <path class="wire both" d="M 447 549 H 702"/>
  <text x="686" y="534" class="label">East</text>
  <path class="wire both" d="M 410 522 V 511 H 620 V 429"/>
  <text x="620" y="413" class="label">North</text>
  <path class="wire both" d="M 355 576 V 614"/>
  <text x="355" y="637" class="label">South</text>
</svg>

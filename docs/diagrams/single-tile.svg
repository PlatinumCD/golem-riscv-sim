<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1510" viewBox="0 0 1280 1510" role="img" aria-labelledby="title desc">
  <title id="title">Tile architecture: RISC-V, shared banked scratchpad, analog accelerator and Mordred</title>
  <desc id="desc">Module diagram of the current src architecture. The CPU contains instruction execution and control, an instruction cache, scalar and vector register files, separate scalar and vector load/store queues and an analog command queue. Queued scalar accesses join instruction fetches from SPM and queued vector accesses at one CPU memory port on the CPU boundary. That port and the network interface unit connect to the same SPM bus. The bus connects to the SPM controller, which contains bank/channel scheduling and serves the physical scratchpad banks and their read/write ports below it. The analog accelerator connects exclusively to the CPU vector-register command interface; each replicated unit has a command queue, register-transfer engine, input buffer, analog array and output buffers. The register-transfer engine connects directly to the analog array for programming and through the input buffer for input preparation. The network interface contains local scratchpad request fragments, queued requests, receive buffers, receive ordering and storage-credit control. Its Mordred NIC connects to the mesh router through its local port. The router contains input buffers and virtual channels, routing and arbitration, a router switch, output buffers and link-credit control. Solid arrows show functional data/request/response connections; dashed arrows show control. Repeated bank and array shapes indicate replication without specifying counts. The drawing uses module and connection names without parameter values.</desc>
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52677e"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; font-size: 21px; fill: #22364a; text-anchor: middle; }
      .heading { font-size: 23px; font-weight: 700; text-anchor: start; letter-spacing: .6px; }
      .subheading { font-size: 20px; font-weight: 700; text-anchor: start; }
      .small { font-size: 18px; }
      .block { fill: #fff; stroke: #9cabbc; stroke-width: 1.5; }
      .cpu-block { stroke: #94aed1; }
      .spm-block { stroke: #82aa9e; }
      .array-block { stroke: #bd9c69; }
      .niu-block { stroke: #ad9ec8; }
      .wire { fill: none; stroke: #52677e; stroke-width: 2.4; stroke-linejoin: round; marker-end: url(#arrow-end); }
      .both { marker-start: url(#arrow-end); }
      .branch { fill: none; stroke: #52677e; stroke-width: 2.4; stroke-linejoin: round; marker-start: url(#arrow-end); }
      .connection { fill: none; stroke: #52677e; stroke-width: 2.4; stroke-linejoin: round; }
      .control { fill: none; stroke: #52677e; stroke-width: 1.8; stroke-dasharray: 6 5; stroke-linejoin: round; marker-end: url(#arrow-end); }
      .junction { fill: #52677e; }
    </style>
  </defs>
  <rect width="1280" height="1510" fill="#fff"/>

  <!-- The local router is outside the compute-tile boundary, as in the mesh view. -->
  <rect id="tile" x="24" y="20" width="1232" height="1134" rx="20" fill="#f8fafc" stroke="#c5cfda" stroke-width="1.6"/>
  <text x="56" y="56" class="heading">TILE</text>

  <!-- Main module groups. -->
  <rect id="cpu" x="56" y="78" width="684" height="500" rx="14" fill="#eaf1fc" stroke="#91acd0" stroke-width="1.6"/>
  <text x="84" y="116" class="heading">RISC-V CPU</text>
  <rect id="arrays" x="802" y="78" width="422" height="500" rx="14" fill="#fcf5e9" stroke="#c2a573" stroke-width="1.6"/>
  <text x="830" y="116" class="heading">ANALOG ACCELERATOR</text>
  <rect id="spm" x="56" y="626" width="684" height="496" rx="14" fill="#eaf4ef" stroke="#88ae9f" stroke-width="1.6"/>
  <text x="84" y="664" class="heading">SHARED BANKED SPM</text>
  <rect id="network-interface" x="802" y="626" width="422" height="496" rx="14" fill="#f1eef8" stroke="#aa9ac4" stroke-width="1.6"/>
  <text x="830" y="664" class="heading">NETWORK INTERFACE</text>

  <!-- CPU instruction and register paths. Control is distinct from payload. -->
  <path class="wire" d="M 266 182 H 302"/>
  <path class="wire both" d="M 354 218 L 354 248 H 184 V 294"/>
  <path class="wire both" d="M 449 218 L 449 294"/>
  <path class="control" d="M 648 218 V 288"/>
  <path class="wire both" d="M 449 368 L 449 436"/>
  <path class="wire both" d="M 548 331 H 582"/>
  <rect id="instruction-cache" class="block cpu-block" x="84" y="146" width="182" height="72" rx="8"/>
  <text x="175" y="176.5">Instruction</text>
  <text x="175" y="201.5">cache</text>
  <rect id="execution-control" class="block cpu-block" x="302" y="146" width="412" height="72" rx="8"/>
  <text x="508" y="176.5">Instruction execution</text>
  <text x="508" y="201.5">and control</text>
  <rect id="scalar-registers" class="block cpu-block" x="84" y="294" width="200" height="74" rx="8"/>
  <text x="184" y="324">Scalar registers</text>
  <text x="184" y="350" class="small">Integer + FP</text>
  <rect id="vector-registers" x="350" y="294" width="198" height="74" rx="8" fill="#dce8fb" stroke="#6b94c7" stroke-width="1.6"/>
  <text x="449" y="324">Vector</text>
  <text x="449" y="350">register file</text>
  <rect id="lsq" class="block cpu-block" x="350" y="436" width="198" height="84" rx="8"/>
  <text x="449" y="459">Vector</text>
  <text x="449" y="484">load/store</text>
  <text x="449" y="509">queue</text>
  <rect id="analog-command-queue" class="block cpu-block" x="582" y="288" width="132" height="86" rx="8"/>
  <text x="648" y="313">Analog</text>
  <text x="648" y="338">command</text>
  <text x="648" y="363">queue</text>

  <rect id="scalar-lsq" class="block cpu-block" x="194" y="436" width="140" height="84" rx="8"/>
  <text x="264" y="459">Scalar</text>
  <text x="264" y="484">load/store</text>
  <text x="264" y="509">queue</text>

  <!-- Cache fills and the scalar/vector queues share one CPU port. -->
  <path id="cache-fill-path" class="branch" d="M 84 182 H 72 V 550 H 610 V 570"/>
  <path id="scalar-lsq-interface" class="wire both" d="M 184 368 V 410 H 264 V 436"/>
  <path id="scalar-memory-path" class="branch" d="M 264 520 V 550"/>
  <path id="vector-memory-path" class="branch" d="M 449 520 L 449 550"/>
  <text x="128" y="467" class="small">Fetch</text>
  <text x="128" y="490" class="small">instructions</text>
  <text x="128" y="513" class="small">from SPM</text>
  <circle class="junction" cx="264" cy="550" r="3.8"/>
  <circle class="junction" cx="449" cy="550" r="3.8"/>
  <rect id="cpu-memory-port" x="602" y="570" width="16" height="16" rx="2" fill="#fff" stroke="#52677e" stroke-width="2"/>
  <text x="592" y="606" class="small" style="text-anchor:end">CPU memory port</text>
  <path id="cpu-spm-interface" class="wire both" d="M 610 586 L 610 700"/>

  <!-- Stacked outlines indicate independently replicated arrays, with no count. -->
  <rect x="844" y="158" width="364" height="408" rx="10" fill="#eee1c9" stroke="#c2a573" stroke-width="1.6"/>
  <rect x="836" y="150" width="364" height="408" rx="10" fill="#f5ead6" stroke="#c2a573" stroke-width="1.6"/>
  <rect id="analog-array" x="828" y="142" width="364" height="408" rx="10" fill="#fffbf3" stroke="#b59869" stroke-width="1.6"/>

  <!-- Scalar compute launch bypasses the CPU vector-transfer command queue. -->
  <path class="control" d="M 714 182 H 754 V 130 H 1030 V 190"/>
  <path id="vector-array-interface" class="wire both" d="M 714 331 H 772 V 216 H 852"/>
  <path class="control" d="M 852 228 H 840 V 508 H 852"/>
  <path class="wire both" d="M 1012 242 L 1012 276"/>
  <path class="wire" d="M 926 332 V 480"/>
  <path class="wire" d="M 1098 332 V 370"/>
  <path class="wire" d="M 1098 426 V 452 H 970 V 480"/>
  <path class="wire" d="M 1000 508 H 1024"/>
  <path class="wire" d="M 1172 508 H 1182 V 304 H 1172"/>
  <rect id="array-command-queue" class="block array-block" x="852" y="190" width="320" height="52" rx="8"/>
  <text x="1012" y="223">Command queue</text>
  <rect id="array-transfer-engine" class="block array-block" x="852" y="276" width="320" height="56" rx="8"/>
  <text x="1012" y="311">Register transfer engine</text>
  <rect id="array-input" class="block array-block" x="1024" y="370" width="148" height="56" rx="8"/>
  <text x="1098" y="392.5">Input</text>
  <text x="1098" y="417.5">buffer</text>
  <rect id="mvm-engine" class="block array-block" x="852" y="480" width="148" height="56" rx="8"/>
  <text x="926" y="502.5">Analog</text>
  <text x="926" y="527.5">Array</text>
  <rect id="array-results" class="block array-block" x="1024" y="480" width="148" height="56" rx="8"/>
  <text x="1098" y="502.5">Output</text>
  <text x="1098" y="527.5">buffers</text>

  <!-- CPU and NIU share one bus and controller; bank scheduling is internal. -->
  <path class="wire both" d="M 398 762 L 398 794"/>
  <path class="connection" d="M 398 950 V 966 M 176 966 H 620"/>
  <path class="wire both" d="M 176 966 L 176 1008"/>
  <path class="wire both" d="M 398 966 L 398 1008"/>
  <path class="wire both" d="M 620 966 L 620 1008"/>
  <rect id="spm-bus" class="block spm-block" x="84" y="700" width="628" height="62" rx="8"/>
  <text x="398" y="738">SPM bus</text>
  <g id="spm-controller">
  <rect id="spm-controller-outline" x="84" y="794" width="628" height="156" rx="10" fill="#f7fbf9" stroke="#82aa9e" stroke-width="1.5"/>
  <text x="398" y="832">SPM controller</text>
  <rect id="bank-channel-scheduling" class="block spm-block" x="112" y="864" width="572" height="62" rx="8"/>
  <text x="398" y="902">Bank/channel scheduling</text>
  </g>
  <g id="spm-bank-left">
  <rect class="block spm-block" x="84" y="1008" width="184" height="84" rx="8"/>
  <path d="M 84 1044 H 268" stroke="#b2cbbf" stroke-width="1.3"/>
  <text x="176" y="1033" class="small">Read / write ports</text>
  <text x="176" y="1075">SPM bank</text>
  </g>
  <g id="spm-bank-middle">
  <rect class="block spm-block" x="306" y="1008" width="184" height="84" rx="8"/>
  <path d="M 306 1044 H 490" stroke="#b2cbbf" stroke-width="1.3"/>
  <text x="398" y="1033" class="small">Read / write ports</text>
  <text x="398" y="1075">SPM bank</text>
  </g>
  <g id="spm-bank-right">
  <rect class="block spm-block" x="528" y="1008" width="184" height="84" rx="8"/>
  <path d="M 528 1044 H 712" stroke="#b2cbbf" stroke-width="1.3"/>
  <text x="620" y="1033" class="small">Read / write ports</text>
  <text x="620" y="1075">SPM bank</text>
  </g>
  <text x="509" y="1075">…</text>

  <!-- NIU request and receive storage; NIC buffers are a separate module. -->
  <rect id="niu" x="828" y="694" width="372" height="242" rx="10" fill="#faf8fd" stroke="#ad9ec8" stroke-width="1.6"/>
  <text x="848" y="726" class="subheading">NIU</text>
  <path id="niu-spm-interface" class="wire both" d="M 712 731 H 780 V 781 H 844"/>
  <path class="wire both" d="M 994 781 H 1032"/>
  <path class="wire" d="M 919 850 V 814"/>
  <path class="control" d="M 1107 850 V 814"/>
  <path class="control" d="M 963 814 V 832 H 1080 V 850"/>
  <rect id="niu-fragments" class="block niu-block" x="844" y="748" width="150" height="66" rx="8"/>
  <text x="919" y="775.5" class="small">SPM request</text>
  <text x="919" y="800.5" class="small">queue</text>
  <rect id="niu-requests" class="block niu-block" x="1032" y="748" width="150" height="66" rx="8"/>
  <text x="1107" y="775.5" class="small">Transfer</text>
  <text x="1107" y="800.5" class="small">request queue</text>
  <rect id="niu-receive" class="block niu-block" x="844" y="850" width="150" height="66" rx="8"/>
  <text x="919" y="877.5" class="small">Receive buffers</text>
  <text x="919" y="902.5" class="small">and ordering</text>
  <rect id="storage-credits" class="block niu-block" x="1032" y="850" width="150" height="66" rx="8"/>
  <text x="1107" y="877.5" class="small">Storage-credit</text>
  <text x="1107" y="902.5" class="small">control</text>
  <path class="wire both" d="M 1014 936 L 1014 966"/>
  <rect id="nic" x="828" y="966" width="372" height="140" rx="10" fill="#e9edf9" stroke="#99a7c6" stroke-width="1.6"/>
  <text x="1014" y="998" style="font-size:20px;font-weight:700">Mordred NIC</text>
  <rect id="nic-transmit" class="block" x="844" y="1016" width="150" height="68" rx="8"/>
  <text x="919" y="1044.5">Transmit</text>
  <text x="919" y="1069.5">buffers</text>
  <rect id="nic-receive" class="block" x="1032" y="1016" width="150" height="68" rx="8"/>
  <text x="1107" y="1044.5">Receive</text>
  <text x="1107" y="1069.5">buffers</text>

  <!-- Router internals aggregate all ports; cardinal links connect to peers. -->
  <path id="nic-router-interface" class="wire both" d="M 1014 1106 L 1014 1190"/>
  <text x="998" y="1181" class="small" style="text-anchor:end">Local port</text>
  <rect id="router" x="220" y="1190" width="840" height="252" rx="14" fill="#eaf0f8" stroke="#91a9c5" stroke-width="1.6"/>
  <text x="246" y="1228" class="heading">MORDRED MESH ROUTER</text>
  <path class="wire" d="M 452 1302 H 528"/>
  <path class="wire" d="M 752 1302 H 828"/>
  <path class="control" d="M 493 1370 V 1352 H 640 V 1334"/>
  <path class="control" d="M 791 1370 V 1352 H 931 V 1334"/>
  <rect id="router-input" class="block" x="246" y="1270" width="206" height="64" rx="8"/>
  <text x="349" y="1295">Input buffers</text>
  <text x="349" y="1321" class="small">and virtual channels</text>
  <rect id="router-switch" class="block" x="528" y="1270" width="224" height="64" rx="8"/>
  <text x="640" y="1309">Router switch</text>
  <rect id="router-output" class="block" x="828" y="1270" width="206" height="64" rx="8"/>
  <text x="931" y="1309">Output buffers</text>
  <rect id="router-arbitration" class="block" x="374" y="1370" width="238" height="52" rx="8"/>
  <text x="493" y="1403" class="small">Routing and arbitration</text>
  <rect id="router-credits" class="block" x="672" y="1370" width="238" height="52" rx="8"/>
  <text x="791" y="1403">Link-credit control</text>
  <path class="wire both" d="M 220 1302 H 112"/>
  <text x="162" y="1286" class="small">West</text>
  <path class="wire both" d="M 1060 1302 H 1168"/>
  <text x="1118" y="1286" class="small">East</text>
  <path class="wire both" d="M 640 1190 L 640 1164"/>
  <text x="687" y="1181" class="small">North</text>
  <path class="wire both" d="M 640 1442 L 640 1482"/>
  <text x="687" y="1481" class="small">South</text>
</svg>

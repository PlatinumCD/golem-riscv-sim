<svg xmlns="http://www.w3.org/2000/svg" width="800" height="732" viewBox="0 0 940 860" role="img" aria-labelledby="title desc">
  <title id="title">Executable-scratchpad tile, instruction cache, and memory paths</title>
  <desc id="desc">Code, constants, data and stack occupy a 256 KiB banked scratchpad. Instructions reach the processor through an 8 KiB instruction cache; scalar and vector data accesses go directly to the scratchpad. Cache fills share its banks with TX DMA, RX DMA and global-memory DMA. The NIC connects to an external mesh router. Shared main memory uses a separate DMA controller, bypassing the mesh. Shown capacities are configurable defaults.</desc>
  <defs>
    <marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#526477"/>
    </marker>
    <marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 Z" fill="#526477"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #233446; font-size: 18px; text-anchor: middle; }
      .small { font-size: 14px; fill: #526477; }
      .wire { fill: none; stroke: #526477; stroke-width: 2; marker-end: url(#end); }
      .both { marker-start: url(#start); }
      .box { fill: #fff; stroke: #a3b1bf; stroke-width: 1.5; }
      .queue { fill: #f0f4fa; stroke: #96abc4; stroke-width: 1.5; }
      .compute { fill: #eaf0fb; stroke: #8da7cf; }
      .tx { fill: #e6f4f2; stroke: #73a9a1; }
      .rx { fill: #efebfa; stroke: #a394c3; }
      .memory { fill: #fff3df; stroke: #c5a36a; }
      .network { fill: #e6effb; stroke: #8da7cf; }
    </style>
  </defs>
  <rect width="940" height="860" fill="#fff"/>
  <rect x="24" y="20" width="610" height="591" rx="16" fill="#f8fafc" stroke="#c5ced8" stroke-width="1.5"/>
  <text x="49" y="49" style="text-anchor:start;font-size:14px;font-weight:bold;letter-spacing:2px">TILE</text>
  <text x="610" y="49" class="small" style="text-anchor:end">Default capacities</text>

  <rect class="box compute" x="85" y="62" width="325" height="143" rx="9"/>
  <text x="247" y="86">RISC-V processor</text>
  <rect x="99" y="96" width="297" height="25" rx="5" fill="#dbe6f7"/>
  <text x="247" y="114" class="small">Instruction execution &amp; control</text>
  <rect x="99" y="130" width="145" height="48" rx="5" fill="#fff"/>
  <rect x="253" y="130" width="143" height="48" rx="5" fill="#fff"/>
  <text x="171" y="149" class="small">Scalar arithmetic</text>
  <text x="171" y="169" style="font-size:13px">Integer + FP registers</text>
  <text x="324" y="149" class="small">RVV arithmetic</text>
  <text x="324" y="169" style="font-size:13px">Vector registers</text>
  <text x="247" y="195" class="small">Scalar + vector loads / stores</text>
  <path class="wire both" d="M 413 127 H 450" stroke-dasharray="5 4"/>
  <rect x="453" y="85" width="157" height="85" rx="9" fill="#faf7f1" stroke="#b6a888" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="531" y="118">Analog arrays</text>
  <text x="531" y="145" class="small">Optional</text>

  <rect class="box compute" x="453" y="179" width="157" height="30" rx="6"/>
  <text x="531" y="200" style="font-size:16px">8 KiB I-cache</text>
  <path class="wire" d="M 531 223 V 211"/>
  <path class="wire" d="M 450 194 H 431 V 184 H 413"/>

  <path class="wire both" d="M 247 207 V 222"/>
  <rect x="85" y="225" width="525" height="105" rx="9" fill="#eef6f3" stroke="#8aafa0" stroke-width="1.5"/>
  <text x="347" y="250">Scratchpad · 256 KiB</text>
  <text x="347" y="271" class="small">Code · constants · data · stack</text>
  <rect class="box" x="105" y="284" width="126" height="30" rx="4"/>
  <rect class="box" x="245" y="284" width="126" height="30" rx="4"/>
  <rect class="box" x="463" y="284" width="126" height="30" rx="4"/>

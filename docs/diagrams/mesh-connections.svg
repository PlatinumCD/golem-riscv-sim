<svg xmlns="http://www.w3.org/2000/svg" width="800" height="644" viewBox="0 0 820 660" role="img" aria-labelledby="title desc">
<title id="title">Tiles connected through a 3 by 3 mesh</title>
<desc id="desc">Nine tiles, each with a network interface attached to its own router. Neighboring routers have links in both directions. A highlighted message travels from tile 0 east twice, then south twice, to tile 8. Intermediate tiles do not participate in forwarding.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#8193a8"/></marker>
  <marker id="route-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#b86513"/></marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #233446; font-size: 16px; }
    .link { fill: none; stroke: #a9b7c7; stroke-width: 1.8; marker-end: url(#arrow); }
    .route { fill: none; stroke: #b86513; stroke-width: 3; marker-end: url(#route-arrow); }
    .small { font-size: 13px; fill: #526477; }
  </style>
</defs>
<rect width="820" height="660" fill="white"/>
<text x="40" y="30" style="text-anchor:start;font-size:14px;font-weight:bold;letter-spacing:1px">3 × 3 MESH · EXAMPLE</text>
<path class="route" d="M219 180 H410"/><path class="link" d="M411 190 H220"/>
<path class="link" d="M190 209 V340"/><path class="link" d="M180 341 V210"/>
<path class="route" d="M135 141 L157 160"/>
<path class="link" d="M149 165 L127 146"/>
<rect x="40" y="69" width="115" height="72" rx="9" fill="#e6f4f2" stroke="#73a9a1" stroke-width="1.5"/>
<text x="97.5" y="95">Tile 0</text>
<rect x="52" y="107" width="91" height="24" rx="4" fill="#e1eafa"/>
<text x="97.5" y="124" class="small">NIC</text>
<rect x="153" y="163" width="64" height="44" rx="7" fill="#e6effb" stroke="#8da7cf" stroke-width="1.5"/>
<text x="185" y="191">R0</text>
<text x="97.5" y="59" style="font-size:13px;fill:#38796f">Source</text>
<path class="route" d="M479 180 H670"/><path class="link" d="M671 190 H480"/>
<path class="link" d="M450 209 V340"/><path class="link" d="M440 341 V210"/>

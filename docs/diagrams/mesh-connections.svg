<text x="357.5" y="124" class="small">NIC</text>
<rect x="413" y="163" width="64" height="44" rx="7" fill="#e6effb" stroke="#8da7cf" stroke-width="1.5"/>
<text x="445" y="191">R1</text>
<path class="route" d="M710 209 V340"/><path class="link" d="M700 341 V210"/>
<path class="link" d="M655 141 L677 160"/>
<path class="link" d="M669 165 L647 146"/>
<rect x="560" y="69" width="115" height="72" rx="9" fill="#f5f7fb" stroke="#bcc8d6" stroke-width="1.5"/>

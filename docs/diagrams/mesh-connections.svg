<path class="route" d="M42 612 H83"/><text x="96" y="617" style="text-anchor:start;font-size:14px">Example message: tile 0 → tile 8</text>
<text x="42" y="644" style="text-anchor:start;font-size:13px;fill:#526477">R = router · NIC = network interface · paired arrows = opposite directions</text>

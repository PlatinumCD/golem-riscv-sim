<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
<title id="title">Golem mesh and global RAM</title><desc id="desc">A three by three mesh with a highlighted X-then-Y route from tile zero to eight. Dedicated per-tile global DMA links form a separate fabric.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><style>text{font-family:DejaVu Sans,sans-serif;fill:#172b45} .title{font-size:26px;font-weight:bold}.head{font-size:19px;font-weight:bold}.body{font-size:16px}.small{font-size:14px}.box{fill:#eff6ff;stroke:#517394;stroke-width:1.5}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style></defs>
<rect width="1000" height="820" fill="white"/><text x="35" y="42" class="title">Golem mesh: configurable links and local lanes</text>
<text x="35" y="76" class="body">3 × 3 example · tile ID = y × width + x · Mittens wormhole routers</text>
<path d="M278 171H349" class="line both"/><path d="M170 247V225" class="line"/><path d="M170 247V269" class="line"/><path d="M568 171H639" class="line both"/><path d="M460 247V225" class="line"/><path d="M460 247V269" class="line"/><path d="M750 247V225" class="line"/><path d="M750 247V269" class="line"/><path d="M278 326H349" class="line both"/><path d="M170 402V380" class="line"/><path d="M170 402V424" class="line"/><path d="M568 326H639" class="line both"/><path d="M460 402V380" class="line"/><path d="M460 402V424" class="line"/><path d="M750 402V380" class="line"/><path d="M750 402V424" class="line"/><path d="M278 481H349" class="line both"/><path d="M568 481H639" class="line both"/><g><rect x="65" y="120" width="210" height="102" rx="9" class="box"/><text x="83" y="149" class="head">Tile 0 · NIC ↔ R0</text><text x="83" y="177" class="body">CPU · SPM · DMA</text><text x="83" y="203" class="small">Local TX / RX lanes</text></g><g><rect x="355" y="120" width="210" height="102" rx="9" class="box"/><text x="373" y="149" class="head">Tile 1 · NIC ↔ R1</text><text x="373" y="177" class="body">CPU · SPM · DMA</text><text x="373" y="203" class="small">Local TX / RX lanes</text></g><g><rect x="645" y="120" width="210" height="102" rx="9" class="box"/><text x="663" y="149" class="head">Tile 2 · NIC ↔ R2</text><text x="663" y="177" class="body">CPU · SPM · DMA</text><text x="663" y="203" class="small">Local TX / RX lanes</text></g><g><rect x="65" y="275" width="210" height="102" rx="9" class="box"/><text x="83" y="304" class="head">Tile 3 · NIC ↔ R3</text><text x="83" y="332" class="body">CPU · SPM · DMA</text><text x="83" y="358" class="small">Local TX / RX lanes</text></g><g><rect x="355" y="275" width="210" height="102" rx="9" class="box"/><text x="373" y="304" class="head">Tile 4 · NIC ↔ R4</text><text x="373" y="332" class="body">CPU · SPM · DMA</text><text x="373" y="358" class="small">Local TX / RX lanes</text></g><g><rect x="645" y="275" width="210" height="102" rx="9" class="box"/><text x="663" y="304" class="head">Tile 5 · NIC ↔ R5</text><text x="663" y="332" class="body">CPU · SPM · DMA</text><text x="663" y="358" class="small">Local TX / RX lanes</text></g><g><rect x="65" y="430" width="210" height="102" rx="9" class="box"/><text x="83" y="459" class="head">Tile 6 · NIC ↔ R6</text><text x="83" y="487" class="body">CPU · SPM · DMA</text><text x="83" y="513" class="small">Local TX / RX lanes</text></g><g><rect x="355" y="430" width="210" height="102" rx="9" class="box"/><text x="373" y="459" class="head">Tile 7 · NIC ↔ R7</text><text x="373" y="487" class="body">CPU · SPM · DMA</text><text x="373" y="513" class="small">Local TX / RX lanes</text></g><g><rect x="645" y="430" width="210" height="102" rx="9" class="box"/><text x="663" y="459" class="head">Tile 8 · NIC ↔ R8</text><text x="663" y="487" class="body">CPU · SPM · DMA</text><text x="663" y="513" class="small">Local TX / RX lanes</text></g>
<path d="M170 112H860V481H867" fill="none" stroke="#c36d18" stroke-width="4" stroke-dasharray="9 5"/>
<text x="312" y="104" class="small">Example route: 0 → 1 → 2 → 5 → 8</text>
<text x="890" y="309" class="small" transform="rotate(90 890 309)">X then Y (default routing)</text>
<rect x="35" y="560" width="930" height="104" rx="9" fill="#fff7ed" stroke="#b77c36"/>
<text x="55" y="590" class="head">32-bit flits ≠ fixed physical link width</text>
<text x="55" y="619" class="body">Width = positive multiple of 32 bits · separate clock and link latency</text>
<text x="55" y="646" class="body">Head pipeline · output arbitration · tail reservation · finite buffers / credits</text>
<path d="M170 674V689H490V716M460 674V689M750 674V689H490" fill="none" stroke="#438267" stroke-width="2" stroke-dasharray="6 4"/>
<text x="545" y="709" class="small">Separate DMA fabric: every tile connects</text>
<rect x="35" y="723" width="930" height="72" rx="9" fill="#f0fdf4" stroke="#438267"/>
<text x="55" y="751" class="head">Shared sparse global RAM + controller</text>
<text x="55" y="779" class="body">Configurable capacity / channels / queues · readiness + service timing · no mesh hops</text>
</svg>
